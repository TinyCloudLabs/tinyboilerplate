name: Real Auth Replay

on:
  workflow_dispatch:
    inputs:
      use_https:
        description: "Generate trusted localhost HTTPS certs before replay"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  real-auth-replay:
    name: Real auth replay
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser
        run: bun run test:browser:install

      - name: Restore credential fixture
        env:
          REAL_AUTH_STORAGE_STATE_B64: ${{ secrets.REAL_AUTH_STORAGE_STATE_B64 }}
          REAL_AUTH_METADATA_B64: ${{ secrets.REAL_AUTH_METADATA_B64 }}
          REAL_AUTH_BACKEND_PRIVATE_KEY: ${{ secrets.REAL_AUTH_BACKEND_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [[ -n "${REAL_AUTH_STORAGE_STATE_B64}" ]] || missing+=("REAL_AUTH_STORAGE_STATE_B64")
          [[ -n "${REAL_AUTH_METADATA_B64}" ]] || missing+=("REAL_AUTH_METADATA_B64")
          [[ -n "${REAL_AUTH_BACKEND_PRIVATE_KEY}" ]] || missing+=("REAL_AUTH_BACKEND_PRIVATE_KEY")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required real-auth secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

          mkdir -p .auth templates/app-starter/backend
          printf '%s' "${REAL_AUTH_STORAGE_STATE_B64}" | base64 --decode > .auth/tinycloud-real-auth.json
          printf '%s' "${REAL_AUTH_METADATA_B64}" | base64 --decode > .auth/tinycloud-real-auth.meta.json
          chmod 600 .auth/tinycloud-real-auth.json .auth/tinycloud-real-auth.meta.json
          printf 'BACKEND_PRIVATE_KEY=%s\n' "${REAL_AUTH_BACKEND_PRIVATE_KEY}" > templates/app-starter/backend/.env
          chmod 600 templates/app-starter/backend/.env

      - name: Configure local HTTPS
        if: ${{ inputs.use_https }}
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          curl -fsSL -o /tmp/mkcert https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-linux-amd64
          chmod +x /tmp/mkcert
          sudo mv /tmp/mkcert /usr/local/bin/mkcert

          mkcert -install
          mkcert \
            -cert-file templates/app-starter/frontend/localhost.pem \
            -key-file templates/app-starter/frontend/localhost-key.pem \
            localhost 127.0.0.1 ::1

          {
            printf 'FRONTEND_URL=https://localhost:5175\n'
            printf 'BACKEND_URL=https://localhost:3003\n'
            printf 'NODE_EXTRA_CA_CERTS=%s/rootCA.pem\n' "$(mkcert -CAROOT)"
            printf 'LOCAL_CA_CERT=%s/rootCA.pem\n' "$(mkcert -CAROOT)"
          } >> "$GITHUB_ENV"

      - name: Configure local HTTP
        if: ${{ !inputs.use_https }}
        run: |
          {
            printf 'FRONTEND_URL=http://localhost:5175\n'
            printf 'BACKEND_URL=http://localhost:3003\n'
          } >> "$GITHUB_ENV"

      - name: Start app-starter
        shell: bash
        run: |
          set -euo pipefail
          curl_args=(--fail --silent --show-error)
          if [[ -n "${LOCAL_CA_CERT:-}" ]]; then
            curl_args+=(--cacert "${LOCAL_CA_CERT}")
          fi

          bun run dev > /tmp/tinyboilerplate-real-auth-dev.log 2>&1 &
          printf '%s\n' "$!" > /tmp/tinyboilerplate-real-auth-dev.pid

          for _ in {1..60}; do
            if curl "${curl_args[@]}" "${BACKEND_URL}/health" >/dev/null && curl "${curl_args[@]}" "${FRONTEND_URL}" >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat /tmp/tinyboilerplate-real-auth-dev.log >&2
          exit 1

      - name: Replay real auth fixture
        run: bun run test:real-auth

      - name: Stop app-starter
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/tinyboilerplate-real-auth-dev.pid ]]; then
            kill "$(cat /tmp/tinyboilerplate-real-auth-dev.pid)" 2>/dev/null || true
          fi
