openapi: 3.1.0
info:
  title: TinyCloud Notes API
  version: 0.1.0
  description: API contract for the TinyCloud Notes example backend.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        "200":
          description: Backend is alive
          content:
            application/json:
              schema:
                type: object
                required: [ok, app]
                properties:
                  ok:
                    type: boolean
                  app:
                    type: string

  /api/manifest:
    get:
      operationId: getManifest
      summary: Runtime TinyCloud app manifest
      security: []
      responses:
        "200":
          description: Runtime manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"

  /api/server-info:
    get:
      operationId: getServerInfo
      summary: Backend delegation policy
      security: []
      responses:
        "200":
          description: Backend DID, status, policy, and policy hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"

  /api/auth/nonce:
    get:
      operationId: createNonce
      summary: Create SIWE nonce
      security: []
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{40}$"
      responses:
        "200":
          description: Nonce created
          content:
            application/json:
              schema:
                type: object
                required: [nonce]
                properties:
                  nonce:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/auth/verify:
    post:
      operationId: verifySession
      summary: Verify SIWE session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, signature]
              properties:
                message:
                  type: string
                signature:
                  type: string
      responses:
        "200":
          description: Backend session token
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresIn, address]
                properties:
                  token:
                    type: string
                  expiresIn:
                    type: integer
                  address:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/delegations/status:
    get:
      operationId: getDelegationStatus
      summary: Check stored delegation status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Delegation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationResponse"
              examples:
                active:
                  value:
                    status: active
                    expiresAt: "2026-05-20T12:00:00.000Z"
                expired:
                  value:
                    status: expired
                    expiresAt: "2026-05-19T12:00:00.000Z"
                stale:
                  value:
                    status: stale
                    expiresAt: null
                none:
                  value:
                    status: none
                    expiresAt: null
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/delegations:
    post:
      operationId: storeDelegation
      summary: Store and activate a portable delegation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serialized]
              properties:
                serialized:
                  type: string
      responses:
        "200":
          description: Delegation active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    delete:
      operationId: revokeDelegation
      summary: Remove stored delegation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Delegation removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/notes:
    get:
      operationId: listNotes
      summary: List and search notes
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Notes list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/DelegationRequired"
        "500":
          $ref: "#/components/responses/StoreError"
    post:
      operationId: createNote
      summary: Create a note
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/DelegationRequired"
        "500":
          $ref: "#/components/responses/StoreError"

  /api/notes/{id}:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    get:
      operationId: getNote
      summary: Get a note with body
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Note detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/DelegationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/StoreError"
    put:
      operationId: updateNote
      summary: Update a note
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteRequest"
      responses:
        "200":
          description: Note updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/DelegationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/StoreError"
    delete:
      operationId: deleteNote
      summary: Delete a note
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Note deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/DelegationRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/StoreError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Backend session token returned by SIWE verification.

  parameters:
    NoteId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthenticated:
      description: Authentication required or failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    DelegationRequired:
      description: Missing or invalid TinyCloud delegation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Requested note was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    StoreError:
      description: TinyCloud storage operation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    ApiError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string

    DelegationResponse:
      type: object
      required: [status, expiresAt]
      properties:
        status:
          type: string
          enum: [active, expired, none, stale]
        expiresAt:
          type:
            - string
            - "null"
          format: date-time

    Note:
      type: object
      required: [id, title, tags, bodyKey, body, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        tags:
          type: array
          items:
            type: string
        bodyKey:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NoteResponse:
      type: object
      required: [note]
      properties:
        note:
          $ref: "#/components/schemas/Note"

    NoteListResponse:
      type: object
      required: [notes]
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/Note"

    CreateNoteRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
        tags:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        body:
          type: string

    UpdateNoteRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        url:
          type:
            - string
            - "null"
          format: uri
        tags:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        body:
          type: string

    ServerInfo:
      type: object
      required: [did, status, name, expiry, permissions, policyHash]
      properties:
        did:
          type: string
          description: "Backend DID (e.g. did:pkh:eip155:1:0x...)"
        status:
          type: string
        name:
          type: string
          description: Human-readable backend name for permission prompts.
        expiry:
          type: string
          description: Backend delegation expiry as an ms-format duration string.
          example: "7d"
        policyHash:
          type: string
          description: SHA-256 hash of the resolved backend delegation policy.
          pattern: "^[a-f0-9]{64}$"
        permissions:
          type: array
          description: Permissions the backend needs the user to delegate.
          items:
            $ref: "#/components/schemas/PermissionEntry"

    Manifest:
      type: object
      required: [app_id, name]
      properties:
        manifest_version:
          type: integer
          enum: [1]
        app_id:
          type: string
        name:
          type: string
        description:
          type: string
        did:
          type: string
        space:
          type: string
        defaults:
          oneOf:
            - type: boolean
            - type: string
              enum: [admin, all]
        expiry:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionEntry"

    PermissionEntry:
      type: object
      required: [service, path, actions]
      properties:
        service:
          type: string
        space:
          type: string
        path:
          type: string
        actions:
          type: array
          items:
            type: string
        skipPrefix:
          type: boolean
        description:
          type: string
