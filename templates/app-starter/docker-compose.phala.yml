services:
  app-backend:
    image: ${BACKEND_IMAGE:-ghcr.io/your-org/tinycloud-app-backend:latest}
    platform: linux/amd64
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PORT: "3003"
      BACKEND_PRIVATE_KEY: ${BACKEND_PRIVATE_KEY}
      TINYCLOUD_HOST: ${TINYCLOUD_HOST:-https://tee.node.tinycloud.xyz}
      FRONTEND_URL: ${FRONTEND_URL:-https://my-app.example.com}
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "await fetch('http://localhost:3003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  dstack-ingress:
    image: ${INGRESS_IMAGE:-ghcr.io/your-org/tinycloud-app-backend:ingress-latest}
    ports:
      - "443:443"
    depends_on:
      - app-backend
    environment:
      DOMAIN: ${PHALA_INGRESS_DOMAIN:-api.my-app.example.com}
      TARGET_ENDPOINT: http://app-backend:3003
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      GATEWAY_DOMAIN: ${PHALA_GATEWAY_CNAME}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
      SET_CAA: "true"
      DNS_PROVIDER: cloudflare
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - cert-data:/etc/letsencrypt
    restart: unless-stopped

volumes:
  cert-data:
